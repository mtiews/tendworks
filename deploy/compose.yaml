# Laptop profile of Tendworks: `docker compose -f deploy/compose.yaml up --wait`.
# Only the control plane API is published, and only on localhost.
name: tendworks

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tend
      POSTGRES_PASSWORD: ${TEND_POSTGRES_PASSWORD:-tend}
      POSTGRES_DB: tend
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tend -d tend"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Durable execution engine in dev mode; state persists in a volume so runs survive restarts.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      - temporal-data:/home/temporal # mounted on the existing home so the volume is owned by the engine user
    ports:
      - "127.0.0.1:8233:8233" # engine web UI for debugging
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The only way to the Docker API (ADR 0001). Endpoints are opened per need;
  # sandbox creation (containers, images, volumes, exec, POST) follows with the sandbox API.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PING: 1
      VERSION: 1

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    environment:
      TEND_DATABASE_URL: postgres://tend:${TEND_POSTGRES_PASSWORD:-tend}@postgres:5432/tend
      TEND_EXECUTION_ENGINE_ADDRESS: temporal:7233
      TEND_SANDBOX_BACKEND_URL: http://docker-proxy:2375
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      # Liveness only: the API answers. Platform health is GET /status itself.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(() => process.exit(0), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres-data:
  temporal-data:
