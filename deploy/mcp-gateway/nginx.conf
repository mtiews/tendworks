# MCP-only gateway (ADR 0019): sandboxes of agent profiles that list the platform MCP
# server reach the server through this proxy, and only its /mcp path. Every other path
# is refused here; the read-only token stays the guard at the server.
worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # The root file system is read-only; temporary files go to the tmpfs on /tmp.
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's DNS, so a recreated server container is found under its new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    client_max_body_size 1m;

    # Exactly /mcp, forwarded as /mcp without the query: a path that merely starts like
    # it, or that normalises to it, never reaches the server as anything else.
    location = /mcp {
      set $platform_mcp http://server:8080/mcp;
      proxy_pass $platform_mcp;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 10m;
    }

    location / {
      return 404;
    }
  }
}
