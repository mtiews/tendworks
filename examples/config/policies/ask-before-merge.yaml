# Asks the human before merging the pull requests of the listed workflows. It is stricter
# than merge-gate, which also applies to them, so it wins. To let the platform merge the
# developer agent's pull requests without asking, remove develop-issue here (or this file).
apiVersion: tendworks.dev/v1
kind: Policy
metadata:
  name: ask-before-merge
spec:
  workflows: [develop-issue]
  merge: ask
