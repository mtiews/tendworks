# Like fake-develop-and-merge, but the policy ask-before-merge applies (merge: ask): the
# merge opens an approval request and the run waits until it is approved (then the
# platform merges) or rejected (the run ends without a merge). Used by the end-to-end
# tests of approval requests.
# Start it with: POST /runs {"workflow": "fake-develop-and-ask", "input": {"issue": {"number": 1, "title": "Say hello"}}}
document:
  dsl: '1.0.3'
  namespace: examples
  name: fake-develop-and-ask
  version: '0.1.0'
  summary: A fake agent opens a pull request; the platform merges it once a human approves.
do:
  - implement:
      call: a2a
      with:
        method: message/send
        agentCard:
          endpoint: agent://fake-pr-developer
        parameters:
          message:
            parts:
              - kind: text
                text: '${ "Implement issue #\(.issue.number // 0): \(.issue.title // "untitled")" }'
      output:
        as: '${ { pullRequest: ([.artifacts[]? | select(.name == "pull-request") | .parts[0].url][0]) } }'
  # From here on as in develop-issue: merge behind the gate, or wait for the approval.
  - merge:
      call: http
      with:
        method: post
        endpoint: '${ $runtime.metadata.controlPlaneUrl + "/pull-requests/merge" }'
        body:
          run: '${ $workflow.id }'
          pullRequest: '${ .pullRequest }'
      output:
        as: '${ $input + { merged: .merged, decision: .decision, approvalRequest: .approvalRequest.id } }'
  - merged:
      switch:
        - done: { when: '${ .merged }', then: end }
  - awaitDecision:
      listen:
        to:
          one:
            with: { type: dev.tendworks.approval.decided }
      output:
        as: '${ $input + { approval: .[0].decision } }'
  - decided:
      switch:
        - approved: { when: '${ .approval == "approve" }', then: mergeApproved }
        - rejected: { then: end }
  - mergeApproved:
      call: http
      with:
        method: post
        endpoint: '${ $runtime.metadata.controlPlaneUrl + "/pull-requests/merge" }'
        body:
          run: '${ $workflow.id }'
          pullRequest: '${ .pullRequest }'
      output:
        as: '${ $input + { merged: .merged } }'
