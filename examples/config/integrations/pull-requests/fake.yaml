# Pull requests in memory on the reserved git.example host, for the fake workflows and
# the end-to-end tests: the fake agent profiles report these pull requests, and the
# platform merges them here without a repository. Remove it from a real configuration.
apiVersion: tendworks.dev/v1
kind: PullRequestIntegration
metadata:
  name: fake
spec:
  host: git.example
  integration: fake
  fake:
    pullRequests:
      - url: https://git.example/example/playground/pull/1
        headBranch: tendworks/fake
