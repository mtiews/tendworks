# The automated path against the real playground repository: every minute, each open
# issue labelled ready-for-agent in the repository of each listed workspace starts one
# develop-issue run in that workspace (the developer agent implements it, opens a pull
# request and reports it; the run ends with it). Suspended, because it needs the
# issues token TENDWORKS_PLATFORM_GITHUB_TOKEN in deploy/.env (issues read only), the
# agent token of the playground workspace (TENDWORKS_AGENT_GITHUB_TOKEN,
# workspaces/playground.yaml) and the agent's harness credential. To use it, set those
# and remove `suspend: true` (docs/platform-implementation.md, pull request smoke test).
# An issue fires once per binding and workspace, also after a failed run; retry with
# POST /runs (ADR 0006). Add a repository by adding its workspace to `workspaces`.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: playground-ready-for-agent
spec:
  suspend: true
  workflow: develop-issue
  workspaces: [playground]
  trigger:
    github-issues:
      labels: [ready-for-agent]
      state: open
      every: { minutes: 1 }
      token: { secretRef: { name: TENDWORKS_PLATFORM_GITHUB_TOKEN } }
