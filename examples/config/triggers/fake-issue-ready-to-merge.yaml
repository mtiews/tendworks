# The whole automated chain with fakes, for the end-to-end tests: the fake integration
# serves one issue labelled ready-to-merge, which starts one fake-develop-and-merge run;
# its fake agent reports the pull request the fake pull request integration serves, and
# the platform merges it behind the policy merge-gate (merge: auto). No account needed.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: fake-issue-ready-to-merge
spec:
  schedule:
    every: { seconds: 10 }
  source:
    integration: fake
    issues:
      repository: chain/playground
      labels: [ready-to-merge]
      state: open
    fake:
      issues:
        - { repository: chain/playground, number: 201, title: Merge me, state: open, labels: [ready-to-merge], url: 'https://issues.example/chain/playground/201' }
  workflow: fake-develop-and-merge
