name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, architecture rules, contract tests, unit tests
        run: pnpm check
      - name: Unit and adapter integration tests with coverage thresholds
        run: pnpm coverage
      - name: Browser for the web UI's end-to-end flows
        run: pnpm --filter @tendworks/browser-tests exec playwright install --with-deps chromium
      - name: Create deploy/.env with random tokens, as an operator does
        run: scripts/setup-env.sh
      - name: End-to-end tests on the compose stack, API and browser
        run: pnpm e2e
        env:
          # The restart test runs the Claude Code harness against a scripted ACP agent; the
          # harness needs some credential selected, which the scripted agent ignores.
          TEND_CLAUDE_CODE_CREDENTIAL: api-key
          ANTHROPIC_API_KEY: scripted-agent-needs-no-key
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
