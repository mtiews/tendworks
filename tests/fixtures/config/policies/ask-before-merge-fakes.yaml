# Asks the human before merging the pull requests of fake-develop-and-ask, the approval
# path of the regular suites. merge-gate from the starter configuration applies too; this
# policy is stricter, so it wins.
apiVersion: tendworks.dev/v1
kind: Policy
metadata:
  name: ask-before-merge-fakes
spec:
  workflows: [fake-develop-and-ask]
  merge: ask
