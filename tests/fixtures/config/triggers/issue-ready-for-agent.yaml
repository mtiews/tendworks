# Starts the hello-agent workflow once for every open issue labelled ready-for-agent.
# The fake integration serves the issues listed below, so the platform runs without an
# issue tracker account; the end-to-end tests rely on exactly these issues.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: issue-ready-for-agent
spec:
  schedule:
    every: { seconds: 10 }
  source:
    integration: fake
    issues:
      repository: example/playground
      labels: [ready-for-agent]
      state: open
    fake:
      issues:
        - { repository: example/playground, number: 101, title: Add a greeting, state: open, labels: [ready-for-agent], url: 'https://issues.example/example/playground/101' }
        - { repository: example/playground, number: 102, title: Fix the typo, state: open, labels: [ready-for-agent, bug], url: 'https://issues.example/example/playground/102' }
        - { repository: example/playground, number: 103, title: Not ready yet, state: open, labels: [], url: 'https://issues.example/example/playground/103' }
        - { repository: example/playground, number: 104, title: Already done, state: closed, labels: [ready-for-agent], url: 'https://issues.example/example/playground/104' }
        - { repository: example/elsewhere, number: 105, title: Other repository, state: open, labels: [ready-for-agent], url: 'https://issues.example/example/elsewhere/105' }
  workflow: hello-agent
  input:
    issue:
      number: '${ .issue.number }'
      title: '${ .issue.title }'
      url: '${ .issue.url }'
