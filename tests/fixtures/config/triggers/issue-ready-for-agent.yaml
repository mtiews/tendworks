# Starts the hello-agent workflow once for every item the fake trigger source serves,
# without a workspace. The fake source serves the items listed below, so the platform
# runs without an issue tracker account; the end-to-end tests rely on exactly these items.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: issue-ready-for-agent
spec:
  workflow: hello-agent
  trigger:
    fake:
      every: { seconds: 10 }
      items:
        - { key: 'example/playground#101', title: Add a greeting, url: 'https://issues.example/example/playground/101', number: 101 }
        - { key: 'example/playground#102', title: Fix the typo, url: 'https://issues.example/example/playground/102', number: 102 }
