# The whole automated chain with fakes, for the end-to-end tests: the fake integration
# serves one issue labelled ready-for-pull-request, which starts one fake-develop-issue
# run; its fake agent reports a pull request, and the run ends with it. No account needed.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: fake-issue-to-pull-request
spec:
  schedule:
    every: { seconds: 10 }
  source:
    integration: fake
    issues:
      repository: chain/playground
      labels: [ready-for-pull-request]
      state: open
    fake:
      issues:
        - { repository: chain/playground, number: 201, title: Open a pull request, state: open, labels: [ready-for-pull-request], url: 'https://issues.example/chain/playground/201' }
  workflow: fake-develop-issue
