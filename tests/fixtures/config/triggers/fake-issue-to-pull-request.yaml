# The whole automated chain with fakes, for the end-to-end tests: the fake trigger source
# serves one issue, which starts one fake-develop-issue run in the fake-playground
# workspace; its fake agent reports a pull request, and the run ends with it. No account
# needed.
apiVersion: tendworks.dev/v1
kind: TriggerBinding
metadata:
  name: fake-issue-to-pull-request
spec:
  workflow: fake-develop-issue
  workspaces: [fake-playground]
  trigger:
    fake:
      every: { seconds: 10 }
      items:
        - { key: 'chain/playground#201', title: Open a pull request, url: 'https://issues.example/chain/playground/201', number: 201 }
