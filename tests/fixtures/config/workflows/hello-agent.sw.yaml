# Smallest useful workflow: hand one task to an agent profile and return its answer.
# Start it with: POST /runs {"workflow": "hello-agent", "input": {"item": {"key": "hello", "title": "Say hello", "number": 1}}}
document:
  dsl: '1.0.3'
  namespace: examples
  name: hello-agent
  version: '0.1.0'
  summary: Hands an item to the fake developer agent.
do:
  - implement:
      call: a2a
      with:
        method: message/send
        agentCard:
          endpoint: agent://fake-developer
        parameters:
          message:
            parts:
              - kind: text
                text: '${ "Implement issue #\(.item.number // 0): \(.item.title // "untitled")" }'
              - kind: data
                data: '${ .item // {} }'
      output:
        as: '${ { taskId: .id, state: .status.state, reply: .status.message.parts[0].text } }'
