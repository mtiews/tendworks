openapi: 3.1.0
info:
  title: Tendworks Control Plane API
  version: 0.1.0
  description: >-
    Public API of the Tendworks control plane. The web UI, the tend CLI, the
    meta-agent and any script use only this API.
paths:
  /status:
    get:
      operationId: getPlatformStatus
      summary: Platform health
      description: >-
        Health of the platform and of each component it depends on. Answers 200
        when the platform is healthy and 503 when it is not; both carry the same
        body.
      responses:
        "200":
          description: Platform is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
        "503":
          description: Platform is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
  /runs:
    post:
      operationId: startRun
      summary: Start a run of a configured workflow
      description: >-
        Starts a run of the workflow named `workflow` (its `document.name`) from the
        configuration. The run executes in the background; poll `GET /runs/{runId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: Run started.
          headers:
            Location:
              description: URL of the new run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "400":
          description: The request is invalid, e.g. no workflow with this name is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listRuns
      summary: List runs, newest first
      responses:
        "200":
          description: Runs with their status and steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get one run with its steps and errors
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "404":
          description: No run with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /triggers:
    get:
      operationId: listTriggers
      summary: List trigger bindings with their next scheduled execution
      responses:
        "200":
          description: Triggers, ordered by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/trigger.schema.yaml#/$defs/triggerList"
        "503":
          description: The trigger gateway, which owns the schedule, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications, newest first
      description: >-
        Notifications the platform recorded, e.g. when a run completed or failed, with
        the status of their delivery.
      responses:
        "200":
          description: Notifications with their delivery status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "503":
          description: Notifications cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /pull-requests/merge:
    post:
      operationId: mergePullRequest
      summary: Merge a pull request behind the gate of a policy
      description: >-
        Merges the pull request with the platform's credentials, never an agent's. The
        named policy decides first: with `merge: auto` the pull request is merged right
        away; `merge: ask` (an approval request first) is refused for now. Merging a pull
        request that is already merged succeeds, so a repeated request is harmless.
        Workflows call this as a step after the agent opened the pull request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePullRequestRequest"
      responses:
        "200":
          description: The pull request is merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestMerge"
        "400":
          description: >-
            The request is invalid: no pull request given (e.g. the agent reported none),
            no policy with this name, or no integration for the pull request's host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The policy does not allow merging without an approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The repository refused the merge, e.g. the pull request is closed or has conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The repository could not be reached or refused the platform's credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    NotificationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/notification.schema.yaml#/$defs/notification"
    MergePullRequestRequest:
      type: object
      required: [pullRequest, policy]
      additionalProperties: false
      properties:
        pullRequest:
          type: [string, "null"]
          description: >-
            Web URL of the pull request, as the agent reported it. `null` (no pull request
            reported) is answered with 400 and a message saying so.
        policy:
          type: string
          description: Name of the configured policy whose gate applies.
    PullRequestMerge:
      type: object
      required: [pullRequest, policy, decision, merged]
      additionalProperties: false
      properties:
        pullRequest:
          type: string
        policy:
          type: string
        decision:
          $ref: "../schemas/policy.schema.yaml#/$defs/decision"
        merged:
          type: boolean
          const: true
        commit:
          type: string
          description: The merge commit, when the repository reports one.
    StartRunRequest:
      type: object
      required: [workflow]
      additionalProperties: false
      properties:
        workflow:
          type: string
          description: Name of a configured workflow (`document.name`).
        input:
          type: object
          additionalProperties: true
          description: Workflow input; defaults to an empty object.
    RunList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/run.schema.yaml#/$defs/run"
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    HealthState:
      type: string
      enum: [healthy, unhealthy]
    PlatformStatus:
      type: object
      required: [status, components, checkedAt]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentStatus"
        checkedAt:
          type: string
          format: date-time
    ComponentStatus:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Generic component name, e.g. store, execution-engine, sandbox-backend.
        status:
          $ref: "#/components/schemas/HealthState"
        message:
          type: string
          description: Reason when the component is unhealthy.
