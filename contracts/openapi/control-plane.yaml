openapi: 3.1.0
info:
  title: Tendworks Control Plane API
  version: 0.1.0
  description: >-
    Public API of the Tendworks control plane. The web UI, the tend CLI, the
    meta-agent and any script use only this API. Every operation but `GET /status` needs
    a bearer token: operations that change state (start a run,
    decide an approval request, start, continue or end a chat) need the platform's API token; reading accepts the API
    token or the read-only token. This is an interim scheme until identity (OIDC)
    arrives.
    A platform that stopped, e.g. after a failed schema migration, answers every
    operation but `GET /status` with 503 and a problem titled `Platform stopped`,
    whatever token is presented; `GET /status` names the failed component.
# Reading accepts either token; operations that change state narrow this to `apiToken`.
security:
  - apiToken: []
  - readToken: []
paths:
  /status:
    get:
      operationId: getPlatformStatus
      # The liveness check stays open, e.g. for the compose health check.
      security: []
      summary: Platform health
      description: >-
        Health of the platform and of each component it depends on, and how many
        approval requests wait for a decision. Answers 200 when the platform is healthy
        and 503 when it is not; both carry the same body.
      responses:
        "200":
          description: Platform is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
        "503":
          description: Platform is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
  /access:
    get:
      operationId: getAccess
      summary: The access the presented token grants
      description: >-
        Whether the presented bearer token may only read (`read`, the read-only token) or
        also change state (`full`, the API token), so that a client can offer only what it
        may do, e.g. the web UI's read-only mode or a script that checks before it acts.
        The API stays the guard: operations that change state refuse the read-only token
        regardless.
      responses:
        "200":
          description: The access of the presented token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The platform stopped, e.g. after a failed schema migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs:
    post:
      operationId: startRun
      security:
        - apiToken: []
      summary: Start a run of a configured workflow
      description: >-
        Starts a run of the workflow named `workflow` (its `document.name`) from the
        configuration. The run executes in the background; poll `GET /runs/{runId}`.
        A caller that traces its work (e.g. the trigger gateway) passes its W3C
        `traceparent`; the run and all its events then belong to that trace. Without
        one the run starts a new trace.
      parameters:
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: Run started.
          headers:
            Location:
              description: URL of the new run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "400":
          description: >-
            The request is invalid, e.g. no workflow with this name is configured or the
            traceparent is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listRuns
      summary: List runs, newest first
      responses:
        "200":
          description: Runs with their status and steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get one run with its steps and errors
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{runId}/tasks/{taskId}/transcript:
    get:
      operationId: getRunTaskTranscript
      summary: Read the transcript of a step's agent session
      description: >-
        The transcript entries of the agent session behind task `taskId`, which a step of
        run `runId` handed to an agent (the step's `taskId`), in order of their position.
        Readable as soon as the step names its task, also while the agent still works.
        Secrets the session was given are redacted.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The transcript so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntryList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id, no step of the run with this task, or the task has no transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, or the agent runtime, which owns transcripts, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{runId}/tasks/{taskId}/transcript/stream:
    get:
      operationId: streamRunTaskTranscript
      summary: Follow the transcript of a step's agent session live
      description: >-
        The transcript of the agent session behind task `taskId` of run `runId` as
        Server-Sent Events (ADR 0017), passed through from the agent runtime: first the
        entries recorded so far, then each new entry as it is recorded, until the task
        ends; then an `end` event, and the stream closes. Each entry event's id is the
        entry's position; a client that reconnects with `Last-Event-ID` continues right
        after that entry, without gaps or duplicates. Secrets the session was given are
        redacted.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: >-
            The live transcript. The schema describes each event of the stream, as a
            client parses it (the role of OpenAPI 3.2's `itemSchema`).
          content:
            text/event-stream:
              schema:
                $ref: "../schemas/transcript-entry.schema.yaml#/$defs/streamEvent"
        "400":
          description: "`Last-Event-ID` is not the position of an entry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id, no step of the run with this task, or no such task in the agent runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Orchestration, which owns runs, or the agent runtime, which owns transcripts, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats:
    post:
      operationId: startChat
      security:
        - apiToken: []
      summary: Start a chat with an agent profile
      description: >-
        Starts a chat (ADR 0015): an agent session with the agent profile `agent`, without
        a run, that the human leads turn by turn. Answers at once with the chat in
        `working` while the agent works on the first message; follow its transcript to see
        the answer. Only profiles with `spec.chat` allow chats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.schema.yaml#/$defs/startChatRequest"
      responses:
        "201":
          description: The chat, working on its first turn.
          headers:
            Location:
              description: Path of the new chat.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "400":
          description: >-
            The body is invalid, no such agent profile is configured, the profile does not
            allow chats, or the repository is no clone URL reachable without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listChats
      summary: List chats, the most recently started first
      description: All chats with their profile, status, start, last activity and cost; ended chats included.
      responses:
        "200":
          description: Chats.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chatList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}:
    get:
      operationId: getChat
      summary: Get a chat
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/messages:
    post:
      operationId: sendChatMessage
      security:
        - apiToken: []
      summary: Send the next message of a chat
      description: >-
        Hands the next message to the chat's agent, which starts its next turn in the same
        agent session. Answers at once with the chat in `working`. Messages are
        serialized: while a turn runs, a message is refused with 409; wait for the turn to
        end (the transcript's `input-required` entry).
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.schema.yaml#/$defs/chatMessageRequest"
      responses:
        "200":
          description: The chat, working on the turn.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "400":
          description: The body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A turn is still running, or the chat has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/cancel:
    post:
      operationId: cancelChatTurn
      security:
        - apiToken: []
      summary: Cancel the current turn of a chat
      description: >-
        Stops the agent's work on the running turn without ending the chat. Answers once
        the turn has stopped, with the chat waiting for the next message
        (`input-required`); the transcript shows the turn as cancelled. Cancelling while
        no turn runs changes nothing.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The chat, waiting for the next message.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The chat has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/end:
    post:
      operationId: endChat
      security:
        - apiToken: []
      summary: End a chat
      description: >-
        Ends the chat for good, also while a turn runs: its sandbox is destroyed and its
        volumes are deleted; the transcript stays readable. Ending an ended chat changes
        nothing.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The ended chat.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/transcript:
    get:
      operationId: getChatTranscript
      summary: Read the transcript of a chat
      description: >-
        The transcript entries of the chat's agent session in order of their position,
        also while a turn runs. Secrets the session was given are redacted.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The transcript so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntryList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/transcript/stream:
    get:
      operationId: streamChatTranscript
      summary: Follow the transcript of a chat live
      description: >-
        The chat's transcript as Server-Sent Events (ADR 0017), passed through from the
        agent runtime: first the entries recorded so far, then each new entry as it is
        recorded, across turns, until the chat ends; then an `end` event, and the stream
        closes. An `input-required` entry marks the end of a turn. Each entry event's id is
        the entry's position; a client that reconnects with `Last-Event-ID` continues right
        after that entry. Secrets the session was given are redacted.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: >-
            The live transcript. The schema describes each event of the stream, as a
            client parses it (the role of OpenAPI 3.2's `itemSchema`).
          content:
            text/event-stream:
              schema:
                $ref: "../schemas/transcript-entry.schema.yaml#/$defs/streamEvent"
        "400":
          description: "`Last-Event-ID` is not the position of an entry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The agent runtime, which owns chats, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /agents:
    get:
      operationId: listAgents
      summary: List the configured agent profiles with their active agent sessions, ordered by name
      description: >-
        The agent profiles workflows can hand tasks to (`agent://<name>`), as the
        configuration defines them, each with the agent sessions that work right now:
        those of runs' steps and those of chats. Answers whether an agent is running.
        When the agent runtime, which owns agent sessions, cannot be reached, the
        profiles are listed without `sessions`: whether they work is unknown then.
      responses:
        "200":
          description: Agent profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The platform stopped, e.g. after a failed schema migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /triggers:
    get:
      operationId: listTriggers
      summary: List trigger bindings with their next scheduled execution
      responses:
        "200":
          description: Triggers, ordered by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/trigger.schema.yaml#/$defs/triggerList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The trigger gateway, which owns the schedule, cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications, newest first
      description: >-
        Notifications the platform recorded, e.g. when a run completed or failed, with
        the status of their delivery.
      responses:
        "200":
          description: Notifications with their delivery status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Notifications cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /approval-requests:
    get:
      operationId: listApprovalRequests
      summary: List approval requests, newest first
      parameters:
        - name: status
          in: query
          required: false
          description: Only requests with this status, e.g. `pending`.
          schema:
            $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalStatus"
      responses:
        "200":
          description: Approval requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestList"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: The status filter is not an approval status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Approval requests cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: askApproval
      security:
        - apiToken: []
      summary: Ask the human on behalf of a running run's human step
      description: >-
        What a workflow's human step (`call: approval`) calls. Human interaction decides by
        the policies of the run's workflow (from the platform's record of the run, never
        from the caller) for the step's action: with `allow` the step proceeds and no
        request is created; with `ask` (also when no policy applies) it records an
        approval request, emits `approval.requested` and the run waits for
        `approval.decided`. Asking again for the same run and step returns that step's
        request, pending or decided, without a second event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskApprovalRequest"
      responses:
        "200":
          description: The decision, and with `ask` the step's approval request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutcome"
        "400":
          description: The body is not a valid question (e.g. no answers, duplicate answer labels).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The run is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Approval requests or runs cannot be read or written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /approval-requests/{approvalRequestId}:
    get:
      operationId: getApprovalRequest
      summary: One approval request with its question, links, answers and, once decided, the chosen answer
      parameters:
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The approval request.
          content:
            application/json:
              schema:
                $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalRequest"
        "401":
          description: The request carries neither the API token nor the read-only token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No approval request with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Approval requests cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /approval-requests/{approvalRequestId}/decision:
    post:
      operationId: decideApprovalRequest
      security:
        - apiToken: []
      summary: Decide an approval request with one of its answers
      description: >-
        Records the chosen answer and emits `approval.decided`, which the waiting run
        receives; the answer's outcome continues or stops it. Deciding a request again
        with the same answer changes nothing; a decided request cannot be decided with
        another answer.
      parameters:
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: The decided approval request.
          content:
            application/json:
              schema:
                $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalRequest"
        "400":
          description: The answer is not one of the request's answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request carries no valid API token.
          headers:
            WWW-Authenticate:
              description: "`Bearer`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request carries the read-only token, which cannot change state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No approval request with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The approval request was already decided with another answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Approval requests cannot be read or written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: >-
        The platform's API token (`TEND_API_TOKEN`), shared by the operator's clients and
        the worker's `call: http` tasks; accepted by every operation. Interim until OIDC; never
        handed to sandboxes.
    readToken:
      type: http
      scheme: bearer
      description: >-
        The platform's read-only token (`TEND_API_READ_TOKEN`), for clients that only read,
        e.g. the platform MCP server of chat agents. Accepted by reading operations;
        operations that change state answer 403 to it. Interim until OIDC; never an agent
        secret a profile can reference.
  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context of the caller (version 00).
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Position of the last entry the client received; the stream continues after it.
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)$"
  schemas:
    TranscriptEntryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/transcript-entry.schema.yaml#/$defs/transcriptEntry"
    ApprovalRequestList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalRequest"
    ApprovalDecisionRequest:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer:
          type: string
          description: Label of one of the request's answers.
    AskApprovalRequest:
      type: object
      required: [run, step, action, question, answers]
      additionalProperties: false
      properties:
        run:
          type: string
          description: Id of the running run whose human step asks.
        step:
          type: string
          minLength: 1
          description: Reference of the human step in the run's workflow, e.g. `/do/1/confirmMerge`.
        action:
          $ref: "../schemas/approval-request.schema.yaml#/$defs/gatedAction"
        question:
          type: string
          minLength: 1
        links:
          type: array
          items:
            $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalLink"
        answers:
          type: array
          minItems: 1
          items:
            $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalAnswer"
          description: The answers to choose from; labels must be unique.
    ApprovalOutcome:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          $ref: "../schemas/policy.schema.yaml#/$defs/decision"
        policy:
          type: string
          description: Name of the policy that decided; absent when no policy applies (the platform asks).
        approvalRequest:
          $ref: "../schemas/approval-request.schema.yaml#/$defs/approvalRequest"
          description: The step's approval request; present exactly when the decision is `ask`.
    NotificationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/notification.schema.yaml#/$defs/notification"
    AgentList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    Agent:
      type: object
      description: An agent profile of the configuration with its active agent sessions.
      required: [name, harness]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name workflows address it by, as `agent://<name>`.
        harness:
          type: string
          description: What answers its tasks, as the profile's `spec.harness` names it.
        sandbox:
          type: string
          description: Sandbox template its sandboxes are created from, if it runs in one.
        skills:
          type: array
          items:
            type: string
          description: Skills copied into its sandbox.
        secrets:
          type: array
          items:
            type: string
          description: Names of the secrets the profile passes into its sandbox (never their values).
        chat:
          description: >-
            The profile's chat settings (ADR 0015), defaults filled in; missing when the
            profile allows no chats, so `POST /chats` refuses it.
          $ref: "../schemas/agent-profile.schema.yaml#/$defs/chatSettings"
        mcp:
          type: array
          uniqueItems: true
          items:
            type: string
          description: >-
            MCP servers the platform configures for its sessions, as the profile lists them
            (e.g. `tendworks`, the platform MCP server); missing when it lists none.
        sessions:
          type: array
          description: >-
            The profile's active agent sessions, the most recently started first; empty when
            none works. Missing when the agent runtime cannot be reached, so it is unknown.
          items:
            $ref: "../schemas/agent-session.schema.yaml#/$defs/agentSession"
    StartRunRequest:
      type: object
      required: [workflow]
      additionalProperties: false
      properties:
        workflow:
          type: string
          description: Name of a configured workflow (`document.name`).
        input:
          type: object
          additionalProperties: true
          description: Workflow input; defaults to an empty object.
        startedBy:
          $ref: "../schemas/run.schema.yaml#/$defs/runOrigin"
          description: What starts the run, e.g. a trigger binding for an item; defaults to `manual`.
    RunList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/run.schema.yaml#/$defs/run"
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    HealthState:
      type: string
      enum: [healthy, unhealthy]
    Access:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [read, full]
          description: "`read`: reading only; `full`: reading and changing state."
    PlatformStatus:
      type: object
      required: [status, components, checkedAt]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentStatus"
        checkedAt:
          type: string
          format: date-time
        pendingApprovals:
          type: integer
          minimum: 0
          description: >-
            Number of approval requests waiting for a decision; absent when approval
            requests cannot be read.
        activeRuns:
          type: integer
          minimum: 0
          description: >-
            Number of runs that are pending or running; absent when runs cannot be read.
    ComponentStatus:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Generic component name, e.g. store, execution-engine, sandbox-backend.
        status:
          $ref: "#/components/schemas/HealthState"
        message:
          type: string
          description: Reason when the component is unhealthy.
