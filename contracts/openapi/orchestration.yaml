openapi: 3.1.0
info:
  title: Tendworks Orchestration API
  version: 0.1.0
  description: >-
    Internal API of the orchestration domain, served by the worker bundle. The control
    plane starts and reads runs through it; it is never published. Orchestration owns
    runs and steps and keeps them after the execution engine has forgotten them.
    A worker that stopped, e.g. after a failed schema migration, answers every operation
    with 503 and a problem titled `Worker stopped`; its health API names the reason.
paths:
  /runs:
    post:
      operationId: startRun
      summary: Start a run of a workflow definition
      description: >-
        Validates the definition, records the run and hands it to the durable execution
        engine. The definition is a snapshot: later configuration changes do not affect
        the run. With a `traceparent` the run belongs to the caller's trace; without one
        it starts a new trace.
      parameters:
        - name: traceparent
          in: header
          required: false
          description: W3C trace context of the caller (version 00).
          schema:
            type: string
            pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: Run recorded and handed to the execution engine.
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "400":
          description: The definition is not a workflow orchestration can run, or the traceparent is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The execution engine did not accept the run, which is recorded as failed; or
            the worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`, and no run is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listRuns
      summary: List runs, newest first
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get one run with its steps
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "../schemas/run.schema.yaml#/$defs/run"
        "404":
          description: No run with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    StartRunRequest:
      type: object
      required: [workflow]
      additionalProperties: false
      properties:
        workflow:
          type: object
          additionalProperties: true
          description: >-
            Workflow definition (Serverless Workflow DSL, subset in
            contracts/schemas/serverless-workflow.schema.yaml), already parsed.
        input:
          type: object
          additionalProperties: true
          description: Workflow input; defaults to an empty object.
        startedBy:
          $ref: "../schemas/run.schema.yaml#/$defs/runOrigin"
          description: What starts the run, e.g. a trigger binding for an item; defaults to `manual`.
    RunList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/run.schema.yaml#/$defs/run"
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
