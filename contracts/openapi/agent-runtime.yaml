openapi: 3.1.0
info:
  title: Tendworks Agent Runtime API
  version: 0.1.0
  description: >-
    Internal API of the agent runtime, served by the worker bundle. The control plane
    reads agent sessions and leads chats through it; it is never published. Every agent
    session belongs to one A2A task (a run's step or a chat), so sessions are addressed by
    their task id; a chat's id is its task's id.
    A worker that stopped, e.g. after a failed schema migration, answers every operation
    with 503 and a problem titled `Worker stopped`; its health API names the reason.
paths:
  /chats:
    post:
      operationId: startChat
      summary: Start a chat with an agent profile
      description: >-
        Creates the chat's A2A task and hands the first message to the agent; answers at
        once with the chat in `working` while the first turn runs. Only profiles with
        `spec.chat` allow chats. Emits `chat.started`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.schema.yaml#/$defs/startChatRequest"
      responses:
        "201":
          description: The chat, working on its first turn.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "400":
          description: >-
            The body is invalid, no such agent profile or workspace is configured, the
            profile does not allow chats, or the workspace has no enabled assistant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listChats
      summary: List chats, the most recently started first
      responses:
        "200":
          description: All chats, ended ones included.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chatList"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}:
    get:
      operationId: getChat
      summary: Get a chat
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/messages:
    post:
      operationId: sendChatMessage
      summary: Send the next message of a chat
      description: >-
        A2A `SendMessage` to the chat's task, which waits in `input-required`: the agent
        starts its next turn in the same agent session; answers at once with the chat in
        `working`. Messages are serialized: while a turn runs, a message is refused.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.schema.yaml#/$defs/chatMessageRequest"
      responses:
        "200":
          description: The chat, working on the turn.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "400":
          description: The body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A turn is still running, or the chat has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/cancel:
    post:
      operationId: cancelChatTurn
      summary: Cancel the current turn of a chat
      description: >-
        Asks the agent to stop the running turn and answers once the turn has stopped,
        with the chat's task in `input-required`; the chat stays open for the next
        message. Cancelling while no turn runs changes nothing.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The chat, waiting for the next message.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The chat has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /chats/{chatId}/end:
    post:
      operationId: endChat
      summary: End a chat
      description: >-
        Ends the chat for good, also while a turn runs: destroys its sandbox and deletes
        its volumes; the transcript stays. Emits `chat.ended`. Ending an ended chat
        changes nothing.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: The ended chat.
          content:
            application/json:
              schema:
                $ref: "../schemas/chat.schema.yaml#/$defs/chat"
        "404":
          description: No chat with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /sessions:
    get:
      operationId: listAgentSessions
      summary: List the active agent sessions, the most recently started first
      description: >-
        Every agent session that has not ended: those of runs' steps (with run and step,
        as the step's message named them) and those of chats. Finished tasks, ended and
        failed chats are left out.
      responses:
        "200":
          description: The active agent sessions.
          content:
            application/json:
              schema:
                $ref: "../schemas/agent-session.schema.yaml#/$defs/agentSessionList"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /tasks/{taskId}/transcript:
    get:
      operationId: getTaskTranscript
      summary: Read the transcript of a task's agent session
      description: >-
        All entries of the transcript in order of their position, also while the agent
        still works. Secrets the session was given are redacted.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The transcript so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntryList"
        "404":
          description: No task with this id, or it has no transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /tasks/{taskId}/transcript/stream:
    get:
      operationId: streamTaskTranscript
      summary: Follow the transcript of a task's agent session live
      description: >-
        The transcript as Server-Sent Events (ADR 0017): first the entries recorded so far,
        then each new entry as it is recorded, until the task ends; then an `end` event, and
        the stream closes. For a task that already ended, all entries and the `end` event.
        Each entry event's id is the entry's position; with `Last-Event-ID` the stream
        starts right after that position, so a client that reconnects misses nothing and
        sees nothing twice. Secrets the session was given are redacted.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: >-
            The live transcript. The schema describes each event of the stream, as a
            client parses it (the role of OpenAPI 3.2's `itemSchema`).
          content:
            text/event-stream:
              schema:
                $ref: "../schemas/transcript-entry.schema.yaml#/$defs/streamEvent"
        "400":
          description: "`Last-Event-ID` is not the position of an entry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No task with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            The worker stopped, e.g. after a failed schema migration (ADR 0021): a problem
            titled `Worker stopped`; its `GET /health` names the component that stopped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Position of the last entry the client received; the stream continues after it.
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)$"
  schemas:
    TranscriptEntryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "../schemas/transcript-entry.schema.yaml#/$defs/transcriptEntry"
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
