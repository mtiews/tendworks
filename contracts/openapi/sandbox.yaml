openapi: 3.1.0
info:
  title: Tendworks Sandbox API
  version: 0.1.0
  description: >-
    Internal API of the sandbox domain: create a sandbox from a sandbox
    template, run commands in it (to completion or attached to their
    standard streams), read and write files, destroy it. Terms
    follow OpenSandbox so another backend can be placed behind it. Its first
    consumer, the agent runtime, calls it in-process; snapshot, restore,
    pause and ports follow when needed.
paths:
  /sandboxes:
    post:
      operationId: createSandbox
      summary: Create and start a sandbox from a sandbox template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: The sandbox is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "422":
          description: The template cannot be honoured, e.g. its image is not on the sandbox host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sandboxes/{sandboxId}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    delete:
      operationId: destroySandbox
      summary: Destroy a sandbox and everything in it
      description: Idempotent; destroying an unknown sandbox succeeds.
      responses:
        "204":
          description: The sandbox no longer exists.
  /sandboxes/{sandboxId}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      operationId: execInSandbox
      summary: Run a command in the sandbox and wait for it to finish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: The command finished; a non-zero exit code is not an error of this API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/processes:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      operationId: attachProcessInSandbox
      summary: Start a long-running process attached to its standard streams
      description: >-
        Starts a command like `execInSandbox`, but keeps its standard input, output
        and error open for the caller instead of waiting for it to finish, e.g. for
        a harness that speaks a protocol over stdio. The client asks to upgrade the
        connection (`Connection: Upgrade`, `Upgrade: tcp`); after `101` the
        connection carries the process's streams. Bytes the client sends are the
        process's standard input; closing the client's write side closes it.
        Bytes from the sandbox are framed: an 8-byte header (stream `1` = stdout or
        `2` = stderr, three zero bytes, payload length as 32-bit big-endian
        unsigned integer) followed by the payload. The connection ends when the
        process exits; its exit code is then available from `getSandboxProcess`.
        Implementations may cut connections that carry no data for a while (the
        Docker backend's socket proxy after 10 minutes), so callers keep long quiet
        sessions alive with traffic of their own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "101":
          description: The process runs; the connection now carries its streams.
          headers:
            X-Process-Id:
              description: Id of the process, for `getSandboxProcess`.
              schema:
                $ref: "#/components/schemas/ProcessId"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - name: processId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProcessId"
    get:
      operationId: getSandboxProcess
      summary: Read whether an attached process still runs and how it ended
      responses:
        "200":
          description: The process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxProcess"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - name: path
        in: query
        required: true
        description: Absolute path of a regular file inside the sandbox.
        schema:
          $ref: "#/components/schemas/AbsolutePath"
    get:
      operationId: readSandboxFile
      summary: Read a file from the sandbox
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: writeSandboxFile
      summary: Write a file into the sandbox
      description: >-
        Creates missing parent directories and replaces an existing file. The
        file is owned by the sandbox user.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "204":
          description: The file is written.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SandboxId"
  responses:
    NotFound:
      description: The sandbox or the file does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SandboxTemplate:
      $ref: "../schemas/sandbox-template.schema.json"
    SandboxId:
      type: string
      pattern: "^[a-z0-9]{1,32}$"
    AbsolutePath:
      type: string
      pattern: "^/"
    IsolationClass:
      type: string
      enum: [container, gvisor]
    CreateSandboxRequest:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template:
          $ref: "#/components/schemas/SandboxTemplate"
    Sandbox:
      type: object
      required: [id, template, isolationClass, state, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/SandboxId"
        template:
          type: string
          description: Name of the sandbox template the sandbox was created from.
        isolationClass:
          $ref: "#/components/schemas/IsolationClass"
        state:
          type: string
          enum: [running]
        createdAt:
          type: string
          format: date-time
    ExecRequest:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: Program and arguments; no shell is involved unless the command starts one.
        workingDirectory:
          $ref: "#/components/schemas/AbsolutePath"
        env:
          type: object
          additionalProperties:
            type: string
    ExecResult:
      type: object
      required: [exitCode, stdout, stderr]
      additionalProperties: false
      properties:
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
    ProcessId:
      type: string
      pattern: "^[A-Za-z0-9]{1,128}$"
    SandboxProcess:
      type: object
      required: [id, running]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ProcessId"
        running:
          type: boolean
        exitCode:
          type: integer
          description: Set once the process has exited. A program that cannot be started ends with 127.
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [sandbox-not-found, file-not-found, image-not-found, isolation-class-unavailable, invalid-request]
        message:
          type: string
