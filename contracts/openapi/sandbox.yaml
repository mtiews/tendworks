openapi: 3.1.0
info:
  title: Tendworks Sandbox API
  version: 0.1.0
  description: >-
    Internal API of the sandbox domain: create a sandbox from a sandbox
    template, run commands in it (to completion or attached to their
    standard streams), read and write files, destroy it. Volumes keep
    directories beyond the life of a sandbox, so a later sandbox can carry
    on with them. Terms
    follow OpenSandbox so another backend can be placed behind it. Its first
    consumer, the agent runtime, calls it in-process; snapshot, restore,
    pause and ports follow when needed. Every implementation serves one
    installation: several installations may share a backend, but each one
    lists, reaches and deletes only its own sandboxes and volumes.
paths:
  /sandboxes:
    get:
      operationId: listSandboxes
      summary: List the installation's sandboxes, running or not
      description: >-
        Every sandbox of this installation that still exists on the backend, also
        those that have stopped (e.g. after the backend host restarted) and those
        no consumer remembers any more, so they can be found and destroyed. Only
        sandboxes recorded as this installation's are listed: one the backend cannot
        attribute (e.g. created before installations were recorded) is left out, so
        no consumer removes another installation's by mistake.
      responses:
        "200":
          description: The installation's sandboxes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sandbox"
    post:
      operationId: createSandbox
      summary: Create and start a sandbox from a sandbox template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: The sandbox is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "422":
          description: The template cannot be honoured, e.g. its image is not on the sandbox host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sandboxes/{sandboxId}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    delete:
      operationId: destroySandbox
      summary: Destroy a sandbox and everything in it
      description: Idempotent; destroying an unknown sandbox succeeds.
      responses:
        "204":
          description: The sandbox no longer exists.
  /volumes:
    get:
      operationId: listVolumes
      summary: List the installation's volumes
      description: >-
        Every volume recorded as this installation's, with when it was created; like
        sandboxes, volumes the backend cannot attribute are left out.
      responses:
        "200":
          description: The installation's volumes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volume"
  /volumes/{volumeName}:
    parameters:
      - name: volumeName
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/VolumeName"
    delete:
      operationId: deleteVolume
      summary: Delete a volume and everything in it
      description: Idempotent; deleting an unknown volume succeeds.
      responses:
        "204":
          description: The volume no longer exists.
        "409":
          description: A sandbox still uses the volume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sandboxes/{sandboxId}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      operationId: execInSandbox
      summary: Run a command in the sandbox and wait for it to finish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: The command finished; a non-zero exit code is not an error of this API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/processes:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      operationId: attachProcessInSandbox
      summary: Start a long-running process attached to its standard streams
      description: >-
        Starts a command like `execInSandbox`, but keeps its standard input, output
        and error open for the caller instead of waiting for it to finish, e.g. for
        a harness that speaks a protocol over stdio. The client asks to upgrade the
        connection (`Connection: Upgrade`, `Upgrade: tcp`); after `101` the
        connection carries the process's streams. Bytes the client sends are the
        process's standard input; closing the client's write side closes it.
        Bytes from the sandbox are framed: an 8-byte header (stream `1` = stdout or
        `2` = stderr, three zero bytes, payload length as 32-bit big-endian
        unsigned integer) followed by the payload. The connection ends when the
        process exits; its exit code is then available from `getSandboxProcess`.
        Implementations may cut connections that carry no data for a while (the
        Docker backend's socket proxy after 10 minutes), so callers keep long quiet
        sessions alive with traffic of their own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "101":
          description: The process runs; the connection now carries its streams.
          headers:
            X-Process-Id:
              description: Id of the process, for `getSandboxProcess`.
              schema:
                $ref: "#/components/schemas/ProcessId"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - name: processId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProcessId"
    get:
      operationId: getSandboxProcess
      summary: Read whether an attached process still runs and how it ended
      responses:
        "200":
          description: The process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxProcess"
        "404":
          $ref: "#/components/responses/NotFound"
  /sandboxes/{sandboxId}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - name: path
        in: query
        required: true
        description: Absolute path of a regular file inside the sandbox.
        schema:
          $ref: "#/components/schemas/AbsolutePath"
    get:
      operationId: readSandboxFile
      summary: Read a file from the sandbox
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: writeSandboxFile
      summary: Write a file into the sandbox
      description: >-
        Creates missing parent directories and replaces an existing file. The
        file is owned by the sandbox user.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "204":
          description: The file is written.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SandboxId"
  responses:
    NotFound:
      description: The sandbox or the file does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SandboxTemplate:
      $ref: "../schemas/sandbox-template.schema.json"
    SandboxId:
      type: string
      pattern: "^[a-z0-9]{1,32}$"
    AbsolutePath:
      type: string
      pattern: "^/"
    IsolationClass:
      type: string
      enum: [container, gvisor]
    CreateSandboxRequest:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template:
          $ref: "#/components/schemas/SandboxTemplate"
        volumes:
          type: array
          description: >-
            Volumes mounted into the sandbox. A volume is created empty on first use
            (taking over the ownership of the directory it is mounted on) and outlives
            the sandbox until it is deleted, so a later sandbox mounting the same
            volume sees its files.
          items:
            $ref: "#/components/schemas/VolumeMount"
        binds:
          type: array
          description: >-
            Directories of the sandbox host bound into the sandbox, read-write or
            read-only. Only directories under the host directories the installation
            allows (its workspace roots) and never a root itself; any other is refused
            (`invalid-request`). A bind is no volume: the backend never creates, lists or
            deletes the directory.
          items:
            $ref: "#/components/schemas/BindMount"
        owner:
          $ref: "#/components/schemas/Owner"
        networks:
          type: array
          uniqueItems: true
          description: >-
            Networks the sandbox joins in addition to the installation's own sandbox
            network, e.g. the network of a gateway it needs. Only networks the
            installation allows sandboxes to join; any other is refused
            (`invalid-request`). Without it, the sandbox joins none.
          items:
            $ref: "#/components/schemas/NetworkName"
    NetworkName:
      type: string
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
      description: Name of a network on the backend.
    Owner:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Who a sandbox belongs to, e.g. the task it works for. Recorded on the sandbox
        and on the volumes it creates, and returned when listing, so a consumer can
        tell which resources are still in use.
    Volume:
      type: object
      required: [name, createdAt]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/VolumeName"
        createdAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/Owner"
          description: Owner of the sandbox that created the volume; missing if it had none.
    VolumeName:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    VolumeMount:
      type: object
      required: [volume, path]
      additionalProperties: false
      properties:
        volume:
          $ref: "#/components/schemas/VolumeName"
        path:
          $ref: "#/components/schemas/AbsolutePath"
          description: Directory inside the sandbox the volume is mounted on.
    BindMount:
      type: object
      required: [hostPath, path, readOnly]
      additionalProperties: false
      properties:
        hostPath:
          $ref: "#/components/schemas/AbsolutePath"
          description: >-
            Directory on the sandbox host, normalized (no `.` or `..` segments), strictly
            under a directory the installation allows.
        path:
          $ref: "#/components/schemas/AbsolutePath"
          description: Directory inside the sandbox the host directory is bound to.
        readOnly:
          type: boolean
          description: Whether the sandbox may only read the directory.
    Sandbox:
      type: object
      required: [id, template, isolationClass, state, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/SandboxId"
        template:
          type: string
          description: Name of the sandbox template the sandbox was created from.
        isolationClass:
          $ref: "#/components/schemas/IsolationClass"
        state:
          type: string
          enum: [running, stopped]
          description: >-
            `stopped`: the sandbox no longer runs (e.g. its backend host restarted);
            it can only be destroyed.
        createdAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/Owner"
          description: The owner it was created with; missing if it had none.
        networks:
          type: array
          description: The additional networks it joined when it was created; missing if none.
          items:
            $ref: "#/components/schemas/NetworkName"
    ExecRequest:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: Program and arguments; no shell is involved unless the command starts one.
        workingDirectory:
          $ref: "#/components/schemas/AbsolutePath"
        env:
          type: object
          additionalProperties:
            type: string
    ExecResult:
      type: object
      required: [exitCode, stdout, stderr]
      additionalProperties: false
      properties:
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
    ProcessId:
      type: string
      pattern: "^[A-Za-z0-9]{1,128}$"
    SandboxProcess:
      type: object
      required: [id, running]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ProcessId"
        running:
          type: boolean
        exitCode:
          type: integer
          description: Set once the process has exited. A program that cannot be started ends with 127.
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [sandbox-not-found, file-not-found, image-not-found, isolation-class-unavailable, invalid-request, volume-in-use]
        message:
          type: string
