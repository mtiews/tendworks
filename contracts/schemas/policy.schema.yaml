$id: https://tendworks.dev/schemas/v1/policy.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Policy
description: >-
  Decides when a gate applies. When a run asks the platform to perform a gated action,
  human interaction evaluates every policy that applies to the run's workflow to `allow`
  (perform the action) or `ask` (an approval request decides first); the strictest
  decision wins, and the action is refused when no policy applies. The run cannot pick
  the policy. For now the only gated action is merging a pull request.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion:
    const: tendworks.dev/v1
  kind:
    const: Policy
  metadata:
    type: object
    title: PolicyMetadata
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        description: Name of the policy, e.g. in approval requests it caused.
  spec:
    title: PolicySpec
    type: object
    required: [merge]
    additionalProperties: false
    properties:
      workflows:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        description: >-
          Names of the workflows (`document.name`) the policy applies to. Without it the
          policy applies to every workflow.
      merge:
        type: string
        enum: [auto, ask]
        description: >-
          How a pull request is merged. `auto`: the platform merges it as soon as the
          workflow asks. `ask`: an approval request is created first and the merge waits
          for its decision.
$defs:
  decision:
    title: PolicyDecision
    description: >-
      What a policy decides for a gated action. `allow`: perform it. `ask`: an approval
      request decides first.
    type: string
    enum: [allow, ask]
