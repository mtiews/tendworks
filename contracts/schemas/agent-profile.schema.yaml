$id: https://tendworks.dev/schemas/v1/schemas/agent-profile.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: AgentProfile
description: >-
  Frontmatter of an agent profile (`agents/<name>.md`). The Markdown body below the
  frontmatter is the role description; harnesses that support it give it to the agent as
  its instructions for every task. Workflows address a profile as `agent://<name>`.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion:
    const: tendworks.dev/v1
  kind:
    const: AgentProfile
  metadata:
    type: object
    title: AgentProfileMetadata
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        description: Name workflows use in `agent://<name>`.
  spec:
    title: AgentProfileSpec
    type: object
    required: [harness]
    additionalProperties: false
    if:
      properties:
        harness:
          const: claude-code
    then:
      properties:
        sandbox:
          type: string
      required: [sandbox]
    properties:
      harness:
        type: string
        enum: [fake, claude-code]
        description: >-
          What answers the tasks. `fake` is the built-in fake agent for tests and demos.
          `claude-code` runs Claude Code over ACP inside a sandbox created from `sandbox`;
          the sandbox template's image must contain the ACP adapter (see
          images/sandbox-claude-code).
      fake:
        $ref: '#/$defs/fakeAgent'
      sandbox:
        type: string
        description: Name of the sandbox template the agent's sandbox is created from.
      skills:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        description: >-
          Skills (Agent Skills format) the agent can use, by directory name under
          `skills/` of the configuration folder (`skills/<name>/SKILL.md` plus any files
          next to it). They are copied into the agent's sandbox before the session starts.
      model:
        type: string
        minLength: 1
        description: >-
          Model the harness uses for the agent's sessions, by the harness's own model id
          (e.g. `claude-opus-5-5` for `claude-code`). Written to the session's harness
          settings before it starts. Absent keeps the harness default. Ignored by `fake`.
      attribution:
        type: boolean
        default: true
        description: >-
          Whether the harness may add AI attribution (co-author trailers, generated-with
          lines, session links) to commits and pull requests. The default `true` keeps the
          harness default; `false` turns attribution off.
      chat:
        $ref: '#/$defs/chatSettings'
      mcp:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [tendworks]
        description: >-
          MCP servers the platform configures for the agent's sessions. `tendworks` is the
          platform MCP server (ADR 0016): read-only tools on the platform's runs, agents and
          trigger bindings. Only sessions of profiles that list it get its address and the
          read-only token (`TEND_API_READ_TOKEN`); workflow agents should not. The platform
          refuses to start when a profile lists it and no valid read-only token is set.
      env:
        type: object
        title: AgentEnvironment
        description: >-
          Environment variables set for the agent inside its sandbox, each from a secret
          the platform holds (ADR 0008). Everything listed here is visible to the agent,
          so list only secrets meant for it, e.g. a key for a service the agent's tools
          call. Repository credentials belong to workspaces (ADR 0022), not to profiles, so
          a profile works with every workspace. A secret that cannot be resolved fails the
          task with its name.
        propertyNames:
          pattern: ^[A-Z_][A-Z0-9_]*$
        additionalProperties:
          $ref: '#/$defs/secretRef'
$defs:
  chatSettings:
    title: AgentChatSettings
    description: >-
      Allows chats with the profile (ADR 0015): a human can start an agent session with it
      directly and lead it turn by turn. Without it the profile only takes tasks from
      workflows, so nobody can steer an agent with push rights past its workflow. Give it only to profiles whose credentials keep a chat inside its workspace.
    type: object
    additionalProperties: false
    properties:
      idleMinutes:
        type: integer
        minimum: 1
        maximum: 1440
        default: 5
        description: >-
          How long a chat may wait for the human's next message before its sandbox is
          destroyed; the volumes stay, and the next message resumes the session in a new
          sandbox.
  secretRef:
    title: AgentSecretRef
    description: >-
      Reference to a secret the platform holds; in the laptop profile an environment
      variable of the worker, set from `deploy/.env` (ADR 0008). Agents may only
      reference agent secrets (`TENDWORKS_AGENT_*`), so a platform secret can never be
      handed into a sandbox.
    type: object
    required: [secretRef]
    additionalProperties: false
    properties:
      secretRef:
        type: object
        required: [name]
        additionalProperties: false
        properties:
          name:
            type: string
            pattern: ^TENDWORKS_AGENT_[A-Z0-9_]+$
  fakeAgent:
    title: FakeAgent
    description: How the fake agent answers every task.
    type: object
    additionalProperties: false
    properties:
      outcome:
        type: string
        enum: [completed, failed]
        default: completed
        description: >-
          `completed` answers with an artifact echoing the message parts; `failed` ends the
          task in `TASK_STATE_FAILED`.
      message:
        type: string
        description: Status message the agent answers with.
      delaySeconds:
        type: number
        minimum: 0
        maximum: 3600
        default: 0
        description: How long the agent works before it answers.
      artifacts:
        type: array
        description: >-
          Artifacts the agent reports in addition to the echo, as an agent in a sandbox
          reports them (e.g. a pull request it opened).
        items:
          $ref: '#/$defs/reportedArtifact'
  reportedArtifact:
    title: ReportedArtifact
    description: >-
      A result an agent reports as a link, e.g. `{ name: pull-request, url: ... }`. It
      becomes an A2A artifact of the task with one `url` part.
    type: object
    required: [name, url]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
      url:
        type: string
      description:
        type: string
