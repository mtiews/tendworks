$id: https://tendworks.dev/schemas/v1/schemas/notification.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Notification
description: >-
  Notifications human interaction records for the operator. A notification is recorded
  before delivery is attempted, so it survives a failing notification channel; it is
  then delivered to every configured channel that selects its kind (ADR 0025).
$defs:
  notification:
    title: Notification
    description: A message to the human that needs no decision, e.g. that a run finished or that an approval request waits.
    type: object
    additionalProperties: false
    required: [id, kind, runId, title, createdAt, deliveries]
    properties:
      id:
        type: string
        description: Notification id, assigned by the platform.
      kind:
        $ref: '#/$defs/notificationKind'
      runId:
        type: string
        description: Run the notification is about.
      title:
        type: string
        description: One line for the human, e.g. "Run 1f3c… of hello-agent completed".
      detail:
        type: string
        description: More context, e.g. why a run failed.
      artifacts:
        type: array
        description: >-
          For a finished run (`run.completed`, `run.failed`): the artifacts its steps
          reported, in step order, e.g. the pull request the agent opened. Channels that
          can link one link the first.
        items:
          $ref: './run.schema.yaml#/$defs/stepArtifact'
      createdAt:
        type: string
        format: date-time
      deliveries:
        type: array
        description: >-
          One entry per notification channel that selects this kind, in channel name
          order. Empty when no channel does.
        items:
          $ref: '#/$defs/delivery'
  notificationKind:
    title: NotificationKind
    description: What the notification is about.
    type: string
    enum: [run.completed, run.failed, approval.requested]
  delivery:
    title: ChannelDelivery
    description: Outcome of the latest attempt to deliver the notification through one channel.
    type: object
    additionalProperties: false
    required: [channel, status]
    properties:
      channel:
        type: string
        description: Name of the notification channel (`metadata.name`).
      status:
        $ref: '#/$defs/deliveryStatus'
      attemptedAt:
        type: string
        format: date-time
        description: When delivery was last attempted.
      error:
        type: string
        description: Why the last delivery attempt failed, e.g. that the channel refused the message.
  deliveryStatus:
    title: DeliveryStatus
    description: >-
      `pending` until delivery has been attempted, then `delivered` or `failed`.
    type: string
    enum: [pending, delivered, failed]
