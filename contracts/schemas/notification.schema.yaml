$id: https://tendworks.dev/schemas/v1/schemas/notification.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Notification
description: >-
  Notifications human interaction records for the operator. A notification is recorded
  before delivery is attempted, so it survives a failing notification channel; it is
  then delivered to every configured channel that selects its kind (ADR 0025).
$defs:
  notification:
    title: Notification
    description: A message to the human that needs no decision, e.g. that a run finished or that an approval request waits.
    type: object
    additionalProperties: false
    required: [id, kind, title, createdAt, deliveries]
    properties:
      id:
        type: string
        description: Notification id, assigned by the platform.
      kind:
        $ref: '#/$defs/notificationKind'
      runId:
        type: string
        description: Run the notification is about; absent for a notification about the platform (`platform.degraded`, `platform.recovered`).
      title:
        type: string
        description: >-
          One line for the human. For a run or an approval request: its status, the run's
          workspace and workflow, and the triggering item or the approval's question, e.g.
          "Completed · app/develop-issue · #42 Fix login", "Approval needed · app/release-app ·
          Deploy release 1.4?" or "Completed · hello-agent" for a manual run without a
          workspace. For the platform: e.g. "Platform degraded: worker".
      detail:
        type: string
        description: >-
          More context. For a run or an approval request the whole message, one entry per line:
          why the run failed or how to answer the approval; the triggering item's link and the
          artifacts (`<name>: <url>`), or the approval's links; last the short run id, e.g.
          `Run 3f2a9c1e (retry of 9b1c0d2e)`. For the platform: the components' messages.
      artifacts:
        type: array
        description: >-
          For a started run (`run.started`): the trigger origin's link (`key` as `name`,
          `title` as `description`), absent for a manual run or an origin without a link.
          For a finished run (`run.completed`, `run.failed`): the artifacts its steps
          reported, in step order, e.g. the pull request the agent opened, followed by the
          trigger origin's link. For `approval.requested`: the request's links (`title` as
          `name`). Channels that can link one link the first.
        items:
          $ref: './run.schema.yaml#/$defs/stepArtifact'
      createdAt:
        type: string
        format: date-time
      deliveries:
        type: array
        description: >-
          One entry per notification channel that selects this kind, in channel name
          order. Empty when no channel does.
        items:
          $ref: '#/$defs/delivery'
  notificationKind:
    title: NotificationKind
    description: What the notification is about.
    type: string
    enum: [run.started, run.completed, run.failed, approval.requested, platform.degraded, platform.recovered]
  delivery:
    title: ChannelDelivery
    description: Outcome of the latest attempt to deliver the notification through one channel.
    type: object
    additionalProperties: false
    required: [channel, status]
    properties:
      channel:
        type: string
        description: Name of the notification channel (`metadata.name`).
      status:
        $ref: '#/$defs/deliveryStatus'
      attemptedAt:
        type: string
        format: date-time
        description: When delivery was last attempted.
      error:
        type: string
        description: Why the last delivery attempt failed, e.g. that the channel refused the message.
  deliveryStatus:
    title: DeliveryStatus
    description: >-
      `pending` until delivery has been attempted, then `delivered` or `failed`.
    type: string
    enum: [pending, delivered, failed]
