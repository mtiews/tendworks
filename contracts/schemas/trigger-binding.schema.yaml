$id: https://tendworks.dev/schemas/v1/schemas/trigger-binding.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: TriggerBinding
description: >-
  Binds a trigger to a workflow and a list of workspaces (ADR 0023). When the trigger
  fires, the trigger gateway starts one run of `spec.workflow` per workspace and per item
  its trigger source reports, with the input `{ workspace, item }`. An item starts at most
  one run per binding and workspace.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion:
    const: tendworks.dev/v1
  kind:
    const: TriggerBinding
  metadata:
    type: object
    title: TriggerBindingMetadata
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
  spec:
    title: TriggerBindingSpec
    type: object
    required: [workflow, trigger]
    additionalProperties: false
    properties:
      workflow:
        type: string
        description: Name (`document.name`) of the configured workflow each firing starts.
      workspaces:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        description: >-
          Names of configured workspaces (kind Workspace). The binding starts one run per
          workspace and item, with the workspace's name as `workspace` in the input.
          Without workspaces it starts one run per item, without a workspace.
      suspend:
        type: boolean
        description: >-
          When true, the binding is never checked, cannot be fired and starts nothing,
          e.g. because it needs a secret that is not set yet. Defaults to false.
      trigger:
        $ref: '#/$defs/trigger'
$defs:
  trigger:
    title: Trigger
    description: >-
      The trigger source that fires the binding, as exactly one kind with its settings.
      Each kind is a trigger source deployed with the platform. `schedule` fires at every
      execution of its schedule, and the tick is the item, keyed by the time of the
      execution. `manual` never fires on its own: the operator fires it through the API
      (ADR 0028).
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties: false
    properties:
      schedule:
        $ref: '#/$defs/schedule'
      github-issues:
        $ref: '#/$defs/githubIssuesTrigger'
      manual:
        $ref: '#/$defs/manualTrigger'
  schedule:
    title: TriggerSchedule
    description: >-
      When the trigger gateway checks the source: a cron expression or an interval.
    oneOf:
      - $ref: '#/$defs/cronSchedule'
      - $ref: '#/$defs/intervalSchedule'
  cronSchedule:
    title: CronSchedule
    type: object
    required: [cron]
    additionalProperties: false
    properties:
      cron:
        type: string
        pattern: ^\S+(\s+\S+){4}$
        description: >-
          Five-field cron expression (minute, hour, day of month, month, day of week),
          evaluated in UTC, e.g. `0 2 * * *` for 02:00 UTC every day.
  intervalSchedule:
    title: IntervalSchedule
    type: object
    required: [every]
    additionalProperties: false
    properties:
      every:
        $ref: '#/$defs/duration'
  duration:
    title: Duration
    description: >-
      Serverless Workflow inline duration. Executions are aligned to multiples of it since
      the Unix epoch, so every instance agrees on the next execution. At least one second.
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      days:
        type: integer
        minimum: 0
      hours:
        type: integer
        minimum: 0
      minutes:
        type: integer
        minimum: 0
      seconds:
        type: integer
        minimum: 0
  githubIssuesTrigger:
    title: GithubIssuesTrigger
    description: >-
      Fires once per issue of each git workspace's repository that carries every label in
      `labels` and is in `state`, asked `every` interval with `token`: the issues token, a platform secret
      that may read the issues of the workspaces' repositories, never a workspace's agent
      credential. Pull requests are never reported as issues. The item is the issue.
    type: object
    required: [every, token]
    additionalProperties: false
    examples:
      - labels: [ready-for-agent]
        every: { minutes: 1 }
        token: { secretRef: { name: TENDWORKS_PLATFORM_GITHUB_TOKEN } }
    properties:
      labels:
        type: array
        items:
          type: string
          minLength: 1
        description: The issue carries every one of these labels. Defaults to none.
      state:
        type: string
        enum: [open, closed, all]
        description: Defaults to `open`.
      every:
        $ref: '#/$defs/duration'
      token:
        $ref: '#/$defs/secretRef'
  manualTrigger:
    title: ManualTrigger
    description: >-
      Never checked on its own: each firing through `POST /triggers/{name}/fire` is one
      new item, keyed by the time of the firing and titled `started by hand`, so firing
      again starts new runs (ADR 0028). Has no settings.
    type: object
    additionalProperties: false
  item:
    title: TriggerItem
    description: >-
      What a trigger source reports, and what a run's input carries as `item`: a key that
      is stable across checks, a title and a link, plus whatever else the source knows
      about it (e.g. an issue's number and body).
    type: object
    required: [key, title]
    additionalProperties: true
    properties:
      key:
        type: string
        minLength: 1
        description: Identifies the item across checks; an item starts one run per binding and workspace.
      title:
        type: string
      url:
        type: string
        description: Link to the item, if it has one.
  secretRef:
    title: SecretRef
    description: >-
      Reference to a secret the platform holds, so the secret itself never appears in
      configuration. In the laptop profile secrets are environment variables of the
      platform, set from `deploy/.env`. Trigger sources may only reference platform
      secrets (`TENDWORKS_PLATFORM_*`), never the agents' or any other variable of the
      platform (ADR 0008).
    type: object
    required: [secretRef]
    additionalProperties: false
    properties:
      secretRef:
        type: object
        required: [name]
        additionalProperties: false
        properties:
          name:
            type: string
            pattern: ^TENDWORKS_PLATFORM_[A-Z0-9_]+$
            description: Name of the secret, e.g. `TENDWORKS_PLATFORM_GITHUB_TOKEN`.
