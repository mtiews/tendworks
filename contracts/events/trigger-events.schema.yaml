$id: https://tendworks.dev/schemas/v1/events/trigger-events.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: TriggerEvents
description: >-
  Events the trigger gateway emits. Each `$defs` entry is the complete schema of one
  event type: the envelope from cloudevent.schema.yaml narrowed to its `type` and `data`.
$defs:
  triggerFired:
    title: TriggerFiredEvent
    description: A trigger binding fired for an item and a workspace and started a run; `runid` is that run.
    allOf:
      - $ref: './cloudevent.schema.yaml'
      - $ref: './cloudevent.schema.yaml#/$defs/runScoped'
    type: object
    required: [type, data]
    properties:
      type:
        const: dev.tendworks.trigger.fired
      data:
        $ref: '#/$defs/triggerFiredData'
  triggerFiredData:
    title: TriggerFiredEventData
    type: object
    additionalProperties: false
    required: [binding, workflow, item]
    properties:
      binding:
        type: string
        description: Name of the trigger binding that fired.
      workflow:
        type: string
        description: Workflow the run executes.
      workspace:
        type: string
        description: Workspace the run works in; absent for a binding without workspaces.
      item:
        $ref: '#/$defs/itemReference'
  itemReference:
    title: ItemReference
    description: The item the trigger source reported.
    type: object
    additionalProperties: false
    required: [key, title]
    properties:
      key:
        type: string
        description: The item's stable key, e.g. `acme/app#7` for an issue.
      title:
        type: string
      url:
        type: string
